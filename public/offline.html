<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - SymDetect Life</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        padding: 20px;
      }

      .offline-container {
        text-align: center;
        max-width: 500px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      }

      .offline-icon {
        font-size: 80px;
        margin-bottom: 20px;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 15px;
        font-weight: 700;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 30px;
        opacity: 0.9;
      }

      .retry-button {
        background: #fff;
        color: #667eea;
        border: none;
        padding: 15px 40px;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 50px;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .retry-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }

      .retry-button:active {
        transform: translateY(0);
      }

      .tips {
        margin-top: 30px;
        padding-top: 30px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
      }

      .tips h2 {
        font-size: 1.2rem;
        margin-bottom: 15px;
      }

      .tips ul {
        list-style: none;
        text-align: left;
        display: inline-block;
      }

      .tips li {
        margin: 10px 0;
        padding-left: 25px;
        position: relative;
      }

      .tips li:before {
        content: "✓";
        position: absolute;
        left: 0;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="offline-container">
      <div class="offline-icon">📡</div>
      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. Don't worry, some
        features are still available offline!
      </p>

      <button class="retry-button" onclick="window.location.reload()">
        Try Again
      </button>

      <div class="tips">
        <h2>Available Offline:</h2>
        <ul>
          <li>View cached health records</li>
          <li>Browse saved symptom checks</li>
          <li>Access your profile information</li>
          <li>View appointment history</li>
        </ul>
      </div>
    </div>

    <script>
      // Auto-retry when online
      window.addEventListener("online", () => {
        window.location.reload();
      });

      // Update UI when connectivity changes
      window.addEventListener("offline", () => {
        console.log("Connection lost");
      });
    </script>
  </body>
</html>
