<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SymDetect Life - AI Health Assistant</title>
    <meta
      name="description"
      content="AI-powered symptom checker, health records management, online pharmacy, and doctor appointments"
    />
    <meta name="author" content="SymDetect Life" />
    <meta
      name="keywords"
      content="health, symptom checker, medical, pharmacy, doctor appointments, AI diagnosis"
    />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SymDetect" />
    <meta name="application-name" content="SymDetect Life" />
    <meta name="msapplication-TileColor" content="#0ea5e9" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icons -->
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/icons/icon-152x152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/icon-192x192.png"
    />

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/icon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/icon-16x16.png"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="SymDetect Life - AI Health Assistant" />
    <meta
      property="og:description"
      content="AI-powered symptom checker, health records management, online pharmacy, and doctor appointments"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta property="og:url" content="https://symdetect.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SymDetect Life - AI Health Assistant" />
    <meta
      name="twitter:description"
      content="AI-powered symptom checker, health records management, online pharmacy, and doctor appointments"
    />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
